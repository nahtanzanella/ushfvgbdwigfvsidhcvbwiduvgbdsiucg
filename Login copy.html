<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro - CYBERSEGURADORAS</title>
</head>
<body>
    <header class="header-principal">
        <div class="logo-area">
            <h1>TECHBREAKER</h1>
            <h2>CYBERSEGURADORAS</h2>
        </div>
        <div>
            <a href="index.html" class="btn-login">Voltar</a>
        </div>
    </header>
        <main>
            <main class="container-login">

                <div class="card-login">
        
                    <h2>Acesso ao Sistema</h2>
        
                    <p class="texto-login">
                        Entre na sua conta para acessar a área do cliente.
                    </p>
        
                    <form class="form-login" onsubmit="event.preventDefault(); alert('Cadastro demonstrativo. Sistema de autenticação ainda não configurado.');">
        
                        <div class="campo-form">
                            <label for="email">Nome</label>
                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                placeholder="Digite seu nome"
                                autocomplete="username"
                                required>
                        </div>
                        
                        <div class="campo-form">
                            <label for="email">Cpf</label>
                            <input
                                type="number"
                                id="cpf"
                                name="cpf"
                                placeholder="Digite seu cpf"
                                autocomplete="username"
                                required>
                        </div>

                        <div class="campo-form">
                            <label for="email">Numero de telefone</label>
                            <input
                                type="number"
                                id="numero"
                                name="numero"
                                placeholder="Digite seu numero de telefone"
                                autocomplete="username"
                                required>
                        </div>
                        
                        <div class="campo-form">
                            <label for="email">E-mail</label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Digite seu e-mail"
                                autocomplete="username"
                                required>
                        </div>

                        <div class="campo-form">
                            <label for="senha">Senha</label>
                            <input
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="Digite sua senha"
                                autocomplete="current-password"
                                required>
                        </div>
        
                        <div class="opcoes-login">
                            <label>
                                <input type="checkbox" name="lembrar">
                                Lembrar meu acesso
                            </label>
                        </div>
        
                        <button type="submit" class="btn-enviar">
                            cadastrar-se
                        </button>
        
                    </form>
        
                    <div class="rodape-login">
                        <p>Li e concordo com os termos de uso</p> <input type="checkbox">
                        <a href="Termosdeuso.html">Termos de uso</a>
                    </div>
        
                    <p class="aviso-login">
                        <strong>Área restrita:</strong>
                        acesso destinado a clientes autorizados.
                    </p>
        
                </div>
        
            </main>
        </main>

    <footer class="footer-principal">
        <p>© 2026 TechBreaker Cyberseguradoras - Segurança máxima para o seu negócio.</p>
    </footer>
</body>
<script>
</script>
</html>
