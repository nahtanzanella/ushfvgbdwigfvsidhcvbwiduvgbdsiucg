<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro - CYBERSEGURADORAS</title>
</head>
<body>
    <header class="header-principal">
        <div class="logo-area">
            <h1>TECHBREAKER</h1>
            <h2>CYBERSEGURADORAS</h2>
        </div>
        <div>
            <a href="Login.html" class="btn-login">Voltar</a>
        </div>
    </header>
        <main>
            <center>
                <div class="box-cadastro">
                    <form action="index.html">
                        <h1>Faça seu Cadastro!</h1>
                        <span>Nome:</span> 
                        <input type="text" placeholder="Digite seu nome" required>
                        <br>
                        <br>
                        <span>Email:</span>
                        <input type="email" placeholder="Digite seu email" required>
                        <br>
                        <br>
                        <span>Numero de telefone:</span>
                        <input type="number" placeholder="Digite seu numero de telefone" required>
                        <br>
                        <br>
                        <span>Cpf:</span>
                        <input type="number" placeholder="Digite seu email" required>
                        <br>
                        <br>
                        <span>Senha:</span>
                        <input type="password" placeholder="Digite sua senha" required>
                        <br>
                        <br>
                        <a href="Termosdeuso.html" class="btn-enviar">Termos de uso</a> 
                        <h6>Li os termos de uso e concordo:</h6><input type="checkbox" required>
                        <button class="btn-enviar">Login</button>
                    </form>
                </div>
            </center>
        </main>

    <footer class="footer-principal">
        <p>© 2026 TechBreaker Cyberseguradoras - Segurança máxima para o seu negócio.</p>
    </footer>
</body>
</html>
